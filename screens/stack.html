<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA World - Stack</title>
  <link rel="stylesheet" href="../styles/stack.css" />
  <!-- Pixel font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>🧱 Stack Visualizer</h1>
      <button class="back-btn" onclick="playMenuSoundAndGoBack()">← Back to Menu</button>
    </header>

    <!-- Instructions -->
    <section class="instructions">
      <p>🎮 How to Play:</p>
      <ul>
        <li>Type a value and press <b>Push</b> or hit <b>Enter</b> ⏎</li>
        <li>Click <b>Pop</b> to remove the top element</li>
        <li>Click <b>Reset</b> to clear the stack</li>
        <li>Stack max size = 8</li>
      </ul>
    </section>

    <div class="stack-controls">
      <input type="text" id="stack-input" maxlength="10" placeholder="Enter value" />
      <button onclick="pushToStack()">Push</button>
      <button onclick="popFromStack()">Pop</button>
      <button onclick="resetStack()">Reset</button>
    </div>

    <div class="stack-display">
      <div class="stack-container" id="stack-container">
        <!-- Elements appear here -->
      </div>
    </div>
  </div>

  <!-- Sound Effects -->
  <audio id="pushSound" src="../sfx/push_button.mp3" preload="auto"></audio>
  <audio id="menuSound" src="../sfx/menu_button.mp3" preload="auto"></audio>
  <audio id="resetSound" src="../sfx/push_button.mp3" preload="auto"></audio>

  <script src="../data_structure/stack.js"></script>
</body>
</html>
