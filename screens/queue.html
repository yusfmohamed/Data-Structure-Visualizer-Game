<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Queue Game</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../styles/queue.css" />

  <!-- Font preload -->
  <link rel="preload" href="../assets/fonts/Minecraft.ttf" as="font" type="font/ttf" crossorigin="anonymous">
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas" width="800" height="800"></canvas>

    <div id="ui">
      <button id="backBtn" class="btn back">← Back</button>
      <h1 id="title">QUEUE VISUALIZER</h1>
      <div id="controls">
        <input id="valueInput" type="text" placeholder="Value" />
        <button id="enqueueBtn" class="btn enqueue">Enqueue</button>
        <button id="dequeueBtn" class="btn dequeue" disabled>Dequeue</button>
      </div>
    </div>
  </div>

  <!-- Sounds -->
  <audio id="pushSound" src="../sfx/push_button.mp3" preload="auto"></audio>
  <audio id="menuSound" src="../sfx/menu_button.mp3" preload="auto"></audio>

  <!-- JavaScript -->
  <script src="../data_structure/queue.js"></script>
  
</body>
</html>
