<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA World</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- Background -->
  <div id="background"></div>

  <!-- Title -->
  <img id="title" src="assets/Title.png" alt="DSA World Title" />

  <!-- Assets above ground -->
  <div id="assets">
    <img src="assets/Hanoi Tower.png" alt="Hanoi Tower" />
    <img src="assets/Stack.png" alt="Stack" />
  </div>

  <!-- Brick ground -->
  <div id="ground"></div>

  <!-- Menu Options -->
  <div id="menu">
    <button class="menu-btn" id="start-btn">Start</button>
    <button class="menu-btn" id="about-btn">About</button>
    <button class="menu-btn" id="main-exit-btn">Exit</button>
  </div>

  <!-- About Modal -->
  <div id="about-modal" aria-hidden="true" role="dialog">
    <button id="modal-close" aria-label="Close about">×</button>
    <h2>About</h2>
    <p>
      Visual video game to help you to understand Data Structure & Algorithm.<br><br>
      Teams consist of:<br>
      - Youssef Mohamed<br>
      - Mohamed Zaghloul<br>
      - Ahmed Emad<br>
      - Mazen Mamdouh<br>
      - Mohamed Mahmoud
    </p>
  </div>

  <script src="script/main.js"></script>
</body>
</html>
