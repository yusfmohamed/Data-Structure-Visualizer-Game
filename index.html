<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA World</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- Background -->
  <div id="background"></div>

  <!-- Title -->
  <img id="title" src="assets/title.png" alt="DSA World Title" />

  <!-- Assets above ground -->
  <div id="assets">
    <img src="assets/Hanoi Tower.png" alt="Hanoi Tower" />
    <img src="assets/stack.png" alt="Stack" />
  </div>

  <!-- Brick ground -->
  <div id="ground"></div>

  <!-- Menu Options -->
  <div id="menu">
    <button class="menu-btn" id="start-btn">Start</button>
    <button class="menu-btn">About</button>
    <button class="menu-btn">Exit</button>
  </div>

  <script src="script/main.js"></script>
</body>
</html>
